<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ohm</title>
    <style>
      body {
        font:
          14px ui-monospace,
          monospace;
        margin: 16px;
        background: #111;
        color: #ddd;
      }
      textarea {
        width: 100%;
        height: 60vh;
        box-sizing: border-box;
        background: #1a1a1a;
        color: inherit;
        font: inherit;
        border: 1px solid #333;
        padding: 8px;
      }
      button {
        font: inherit;
        margin: 8px 0;
      }
      #log.error {
        color: #f66;
      }
    </style>
  </head>
  <body>
    <textarea id="src" spellcheck="false">
bpm = 100
div = (lfo 0.1)
out = (pluck &lt;c6 d#3 f5 d4&gt; (clock * 4 % 1 &lt; 0.01) 0.9999) -> bp ((lfo 0.12) * 1000 + 500) 5 -> bbd div 1 -> mix
bus = out * 0.8 -> reverb -> bbd 0.25 0.9
(out + bus) * 0.5
</textarea>
    <button id="play">play</button> <span>cmd/ctrl+enter to reload</span>
    <pre id="log"></pre>
    <script type="module">
      const src = document.getElementById("src");
      const log = document.getElementById("log");
      let ctx, node;

      const send = () =>
        node?.port.postMessage({
          src: new TextEncoder().encode(src.value),
          fresh: false,
        });

      document.getElementById("play").onclick = async () => {
        if (ctx) return ctx.state === "running" ? ctx.suspend() : ctx.resume();
        ctx = new AudioContext();
        await ctx.audioWorklet.addModule("ohm-worklet.js");
        const module = await WebAssembly.compileStreaming(fetch("ohm_rs.wasm"));
        node = new AudioWorkletNode(ctx, "ohm", {
          outputChannelCount: [2],
          processorOptions: { module },
        });
        node.port.onmessage = ({ data }) => {
          log.className = data.ok ? "" : "error";
          log.textContent = data.ok ? "ok" : new TextDecoder().decode(data.err);
        };
        node.onprocessorerror = () => {
          log.className = "error";
          log.textContent = "engine crashed, reload the page";
        };
        node.connect(ctx.destination);
        send();
      };

      src.onkeydown = e => {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
          e.preventDefault();
          send();
        }
      };
    </script>
  </body>
</html>
